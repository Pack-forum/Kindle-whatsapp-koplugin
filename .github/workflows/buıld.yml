name: Build plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Araçları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit zip

      - name: Lua sözdizimi kontrolü
        run: |
          for f in whatsapp.koplugin/*.lua; do
            echo "Kontrol: $f"
            luajit -bl "$f" > /dev/null
          done

      - name: Köprü sözdizimi kontrolü
        run: node --check bridge/server.js

      - name: Paketle
        run: |
          rm -f whatsapp.koplugin.zip bridge.zip
          zip -r whatsapp.koplugin.zip whatsapp.koplugin
          zip -r bridge.zip bridge -x "bridge/node_modules/*" "bridge/data/*"
          unzip -l whatsapp.koplugin.zip

      - name: Dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: kindle-whatsapp
          path: |
            whatsapp.koplugin.zip
            bridge.zip
          if-no-files-found: error

      - name: Release oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whatsapp.koplugin.zip
            bridge.zip
          generate_release_notes: true
